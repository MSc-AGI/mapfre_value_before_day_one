<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 1 - MAPFRE Title</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --navy: #1A2744;
    --dark-navy: #0F1A2E;
    --accent: #2B7A9B;
    --accent-lt: #3A9DBF;
    --white: #FFFFFF;
    --med-gray: #8895A7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .slide {
    width: 960px;
    height: 540px;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    background: var(--dark-navy);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
  }

  .slide::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-lt));
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 48px;
    color: var(--white);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 22px;
    color: var(--accent-lt);
    font-weight: 300;
    margin-bottom: 16px;
  }

  .tagline {
    font-size: 14px;
    color: var(--med-gray);
    font-style: italic;
  }

  .footer-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 48px;
    background: var(--navy);
    display: flex;
    align-items: center;
    padding: 0 80px;
    font-size: 12px;
    color: var(--med-gray);
  }

  .slide-number {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="slide">
  <h1>MAPFRE ESPANA</h1>
  <div class="subtitle">AI Strategy & Process Transformation</div>
  <div class="tagline">Proof of Value &mdash; Preliminary Strategic Analysis</div>
  <div class="footer-bar">Marcelo Caballero &nbsp;|&nbsp; MSc AI &nbsp;|&nbsp; AI Strategy & Transformation Consultant</div>
  <span class="slide-number">1 / 8</span>
</div>

</body>
</html>
