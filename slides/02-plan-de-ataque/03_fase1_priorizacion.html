<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fase 1 - Kill/Scale Framework + Compliance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .slide {
    width: 960px;
    height: 540px;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    background: #0F1A2E;
  }
</style>
</head>
<body>
<div class="slide">
  <svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
    <defs>
      <filter id="sh" x="-3%" y="-3%" width="106%" height="110%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
      </filter>
    </defs>

    <!-- Background -->
    <rect width="960" height="540" fill="#0F1A2E"/>
    <rect x="0" y="0" width="960" height="4" fill="#38A169"/>

    <!-- TITLE -->
    <text x="40" y="40" fill="#38A169" font-family="sans-serif" font-size="13" font-weight="bold">FASE 1  |  MESES 2-5</text>
    <text x="40" y="68" fill="#fff" font-family="Georgia, serif" font-size="24" font-weight="bold">Kill/Scale Framework + Compliance Mapping</text>
    <text x="40" y="90" fill="#8895A7" font-family="sans-serif" font-size="12" font-style="italic">El framework de decisión que hoy no existe: criterios objetivos para escalar o matar cada piloto</text>

    <!-- ══ LEFT: DECISION FRAMEWORK ══ -->
    <rect x="40" y="108" width="440" height="200" rx="6" fill="#1A2744" filter="url(#sh)"/>
    <rect x="40" y="108" width="440" height="4" rx="2" fill="#38A169"/>
    <text x="55" y="130" fill="#38A169" font-family="sans-serif" font-size="12" font-weight="bold">DECISION MATRIX: SCALE / REDESIGN / KILL</text>

    <!-- Matrix header -->
    <rect x="55" y="142" width="410" height="22" rx="3" fill="#0F1A2E"/>
    <text x="160" y="157" text-anchor="middle" fill="#8895A7" font-family="sans-serif" font-size="10" font-weight="bold">P&amp;L IMPACT</text>
    <text x="300" y="157" text-anchor="middle" fill="#8895A7" font-family="sans-serif" font-size="10" font-weight="bold">COMPLIANCE COST</text>
    <text x="420" y="157" text-anchor="middle" fill="#8895A7" font-family="sans-serif" font-size="10" font-weight="bold">DECISIÓN</text>

    <!-- Row 1: High impact, Low compliance -->
    <rect x="55" y="168" width="410" height="28" rx="2" fill="#38A169" opacity="0.12"/>
    <text x="160" y="186" text-anchor="middle" fill="#C6F6D5" font-family="sans-serif" font-size="11" font-weight="bold">Alto</text>
    <text x="300" y="186" text-anchor="middle" fill="#C6F6D5" font-family="sans-serif" font-size="11">Bajo / Medio</text>
    <text x="420" y="186" text-anchor="middle" fill="#38A169" font-family="sans-serif" font-size="12" font-weight="bold">SCALE</text>

    <!-- Row 2: High impact, High compliance -->
    <rect x="55" y="200" width="410" height="28" rx="2" fill="#D69E2E" opacity="0.12"/>
    <text x="160" y="218" text-anchor="middle" fill="#FEFCBF" font-family="sans-serif" font-size="11" font-weight="bold">Alto</text>
    <text x="300" y="218" text-anchor="middle" fill="#FEFCBF" font-family="sans-serif" font-size="11">Alto (high-risk)</text>
    <text x="420" y="218" text-anchor="middle" fill="#D69E2E" font-family="sans-serif" font-size="12" font-weight="bold">REDESIGN</text>

    <!-- Row 3: Low impact, Low compliance -->
    <rect x="55" y="232" width="410" height="28" rx="2" fill="#D69E2E" opacity="0.08"/>
    <text x="160" y="250" text-anchor="middle" fill="#E2E6EB" font-family="sans-serif" font-size="11">Bajo</text>
    <text x="300" y="250" text-anchor="middle" fill="#E2E6EB" font-family="sans-serif" font-size="11">Bajo</text>
    <text x="420" y="250" text-anchor="middle" fill="#8895A7" font-family="sans-serif" font-size="12" font-weight="bold">DEPRIORITIZE</text>

    <!-- Row 4: Low impact, High compliance = KILL -->
    <rect x="55" y="264" width="410" height="28" rx="2" fill="#C53030" opacity="0.15"/>
    <text x="160" y="282" text-anchor="middle" fill="#FED7D7" font-family="sans-serif" font-size="11">Bajo</text>
    <text x="300" y="282" text-anchor="middle" fill="#FED7D7" font-family="sans-serif" font-size="11">Alto (high-risk)</text>
    <text x="420" y="282" text-anchor="middle" fill="#C53030" font-family="sans-serif" font-size="12" font-weight="bold">KILL</text>

    <!-- Key insight -->
    <text x="55" y="302" fill="#fefcbf" font-family="sans-serif" font-size="10" font-weight="bold">Argumento dual: no genera ROI + cuesta compliance = kill inmediato sin debate político</text>

    <!-- ══ RIGHT TOP: EU AI Act Classification ══ -->
    <rect x="500" y="108" width="425" height="148" rx="6" fill="#1A2744" filter="url(#sh)"/>
    <rect x="500" y="108" width="425" height="4" rx="2" fill="#C53030"/>
    <text x="515" y="130" fill="#C53030" font-family="sans-serif" font-size="12" font-weight="bold">EU AI ACT: CLASIFICACIÓN POR USE CASE</text>

    <!-- Risk levels -->
    <rect x="515" y="142" width="120" height="44" rx="4" fill="#C53030" opacity="0.2" stroke="#C53030" stroke-width="1"/>
    <text x="575" y="160" text-anchor="middle" fill="#FED7D7" font-family="sans-serif" font-size="11" font-weight="bold">HIGH-RISK</text>
    <text x="575" y="178" text-anchor="middle" fill="#FED7D7" font-family="sans-serif" font-size="9">Pricing, claims,</text>

    <rect x="645" y="142" width="130" height="44" rx="4" fill="#D69E2E" opacity="0.15" stroke="#D69E2E" stroke-width="1"/>
    <text x="710" y="160" text-anchor="middle" fill="#FEFCBF" font-family="sans-serif" font-size="11" font-weight="bold">LIMITED-RISK</text>
    <text x="710" y="178" text-anchor="middle" fill="#FEFCBF" font-family="sans-serif" font-size="9">Chatbots, NLP</text>

    <rect x="785" y="142" width="125" height="44" rx="4" fill="#38A169" opacity="0.15" stroke="#38A169" stroke-width="1"/>
    <text x="847" y="160" text-anchor="middle" fill="#C6F6D5" font-family="sans-serif" font-size="11" font-weight="bold">MINIMAL-RISK</text>
    <text x="847" y="178" text-anchor="middle" fill="#C6F6D5" font-family="sans-serif" font-size="9">Analytics, BI</text>

    <text x="515" y="210" fill="#E2E6EB" font-family="sans-serif" font-size="11">Cada use case clasificado. Los high-risk entran en</text>
    <text x="515" y="226" fill="#E2E6EB" font-family="sans-serif" font-size="11">track de compliance acelerado (governance + doc).</text>
    <text x="515" y="244" fill="#8895A7" font-family="sans-serif" font-size="10" font-style="italic">Deadline: Ago 2026. Esto alimenta directamente Fase 4.</text>

    <!-- ══ RIGHT BOTTOM: Baseline Protocol ══ -->
    <rect x="500" y="268" width="425" height="106" rx="6" fill="#1A2744" filter="url(#sh)"/>
    <rect x="500" y="268" width="425" height="4" rx="2" fill="#805AD5"/>
    <text x="515" y="290" fill="#805AD5" font-family="sans-serif" font-size="12" font-weight="bold">D4: BASELINE DOCUMENTATION PROTOCOL</text>

    <text x="515" y="312" fill="#E2E6EB" font-family="sans-serif" font-size="11">Para cada use case que pase a "SCALE":</text>
    <text x="515" y="330" fill="#E2E6EB" font-family="sans-serif" font-size="11">Documentar métricas pre-deploy (el "antes")</text>
    <text x="515" y="348" fill="#E2E6EB" font-family="sans-serif" font-size="11">para poder demostrar el "después".</text>
    <text x="515" y="366" fill="#fefcbf" font-family="sans-serif" font-size="10" font-weight="bold">Sin baseline, no hay attribution. Sin attribution, no hay narrativa.</text>

    <!-- ══ WORK PACKAGES ══ -->
    <rect x="40" y="320" width="440" height="128" rx="6" fill="#1A2744" filter="url(#sh)"/>
    <rect x="40" y="320" width="440" height="4" rx="2" fill="#38A169"/>
    <text x="55" y="342" fill="#38A169" font-family="sans-serif" font-size="12" font-weight="bold">WORK PACKAGES (Fase 1)</text>

    <text x="55" y="364" fill="#fefcbf" font-family="sans-serif" font-size="11" font-weight="bold">WP 1.1: Decision Framework Design</text>
    <text x="55" y="380" fill="#E2E6EB" font-family="sans-serif" font-size="10">Definir criterios, pesos, umbrales de kill/scale/redesign</text>

    <text x="55" y="400" fill="#fefcbf" font-family="sans-serif" font-size="11" font-weight="bold">WP 1.2: EU AI Act Risk Classification</text>
    <text x="55" y="416" fill="#E2E6EB" font-family="sans-serif" font-size="10">Clasificar cada use case activo (high / limited / minimal)</text>

    <text x="55" y="436" fill="#fefcbf" font-family="sans-serif" font-size="11" font-weight="bold">WP 1.3: Baseline Protocol + Impact Attribution v1</text>
    <text x="55" y="452" fill="#E2E6EB" font-family="sans-serif" font-size="10">Template de baseline + primer modelo de atribución por use case</text>

    <!-- ══ BOTTOM: Key Milestone ══ -->
    <rect x="40" y="460" width="885" height="40" rx="6" fill="#38A169" opacity="0.15" stroke="#38A169" stroke-width="1.5"/>
    <text x="55" y="484" fill="#38A169" font-family="sans-serif" font-size="13" font-weight="bold">MILESTONE FIN FASE 1:</text>
    <text x="268" y="484" fill="white" font-family="sans-serif" font-size="13">Decision Framework aprobado + Risk Classification completa + D1/D4 operativos</text>

    <!-- ══ FOOTER ══ -->
    <rect x="0" y="502" width="960" height="38" fill="rgba(15,26,46,0.95)"/>
    <text x="40" y="525" fill="#8895A7" font-family="sans-serif" font-size="10">Marcelo Caballero</text>
    <text x="160" y="525" fill="#4A5568" font-family="sans-serif" font-size="10">|</text>
    <text x="172" y="525" fill="#8895A7" font-family="sans-serif" font-size="10">Advisory Proposal for CDO MAPFRE Espa&#241;a</text>
    <text x="920" y="525" text-anchor="end" fill="#4A5568" font-family="sans-serif" font-size="10">22.04.2026</text>

  </svg>
</div>
</body>
</html>
