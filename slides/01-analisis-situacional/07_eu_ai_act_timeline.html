<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Slide 7 - EU AI Act Timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    background: #1a1a2e;
    display: flex;
    justify-content: center;

  .slide {
    width: 960px;
    height: 540px;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);

  .title-bar {
    height: 52px;
    background: #1A2744;

    padding: 0 40px;

  .title-bar h1 {

    font-weight: 700;
    font-size: 20px;
    color: #FFFFFF;
    letter-spacing: -0.3px;
  }

  .diagram-area {
    width: 100%;
    height: 488px;
  }

  .slide-number {
    position: absolute;
    bottom: 6px;
    right: 12px;
    font-size: 10px;
    color: rgba(0,0,0,0.2);
    z-index: 10;
  }
</style>
</head>
<body>
